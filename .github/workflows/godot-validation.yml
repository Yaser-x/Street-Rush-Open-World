name: Godot project validation

on:
  push:
    branches:
      - prototype/godot-3d-foundation
  pull_request:
    branches:
      - prototype/godot-3d-foundation
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 5

      - name: Run driving prototype smoke test in game loop
        run: godot --headless --path . res://tests/prototype_smoke_test.tscn --quit-after 240
